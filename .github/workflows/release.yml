name: release

# Push a tag like v0.1.0 to build the jar and publish it to CurseForge and
# GitHub Releases. The tag must match mod_version in gradle.properties.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches mod_version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version $version" >&2
            exit 1
          fi

      - run: ./gradlew build

      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1761542
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: build/libs/!(*-sources).jar
          name: Hush Mortem ${{ github.ref_name }}
          version-type: release
          loaders: fabric
          game-versions: |
            26.1.2
            26.2
            26.3
          java: 25
          changelog-file: CHANGELOG.md
